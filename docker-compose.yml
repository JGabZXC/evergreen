version: "3.8"
services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: evergreen_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
  backend:
    build:
      context: ./backend
      target: development
    container_name: evergreen_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
  mongo:
    image: mongo:8.2.2
    container_name: evergreen_mongo
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
