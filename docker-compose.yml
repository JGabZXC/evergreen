version: "3.8"
services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: evergreen_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    networks:
      - frontend_network
  backend:
    build:
      context: ./backend
      target: development
    container_name: evergreen_backend
    networks:
      - backend_network
      - frontend_network
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    container_name: evergreen_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: evergreen_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d evergreen_db || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge

volumes:
  postgres-data:
