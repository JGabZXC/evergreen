version: "3.8"
services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: evergreen_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
  backend:
    build:
      context: ./backend
      target: development
    container_name: evergreen_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
  mongo:
    image: mongo:7.0
    container_name: evergreen_mongo
    ports:
      - "27018:27017"
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongo-data:/data/db
      - ./backend/mongo-keyfile:/tmp/mongo-keyfile-source:ro
    entrypoint: >
      bash -c "
      cp /tmp/mongo-keyfile-source /etc/mongo-keyfile && 
      chmod 400 /etc/mongo-keyfile && 
      chown 999:999 /etc/mongo-keyfile && 
      docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile
      "
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  mongo-init:
    image: mongo:7.0
    container_name: evergreen_mongo_init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for Mongo to come online...';
      sleep 2;
      mongosh --host mongo:27017 -u ${MONGO_ROOT_USER:-root} -p ${MONGO_ROOT_PASSWORD:-rootpassword} --authenticationDatabase admin --eval '
        try {
          var status = rs.status();
          if (status.ok === 1) {
            print(\"Replica Set is already active.\");
          } else {
            print(\"Replica Set needs init. initializing...\");
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
          }
        } catch (e) {
          print(\"Error catching status. Initializing fresh...\");
          rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
        }
      '"

volumes:
  mongo-data:
