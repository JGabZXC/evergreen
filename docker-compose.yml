version: "3.8"
services:
  frontend:
    build: ./frontend
    container_name: evergreen_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
  backend:
    build: ./backend
    container_name: evergreen_backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
  mongo:
    image: mongo:6
    container_name: evergreen_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
